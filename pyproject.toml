[project]
name = "breakpulse"
version = "1.0.0"
description = "Intelligent Break Reminder, Eye Strain Guard & Pomodoro Productivity Desktop App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "pystray>=0.19.5",
]

[project.scripts]
breakpulse = "main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
